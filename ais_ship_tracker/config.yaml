name: "AIS Ship Tracker"
version: "1.5.0"
slug: "ais_ship_tracker"
description: "Tracks passing ships via AISStream, Open Waters, or local AIS-catcher"
url: "https://github.com/buttermilkgreen/ais_ship_tracker" 
arch:
  - "aarch64"
  - "amd64"
  - "armv7"
startup: "services"
boot: "auto"
icon: "icon.png"
init: false
homeassistant_api: true
services:
  - "mqtt:want"
options:
  data_source: "AISStream.io"
  api_key: ""
  longitude_west: 1.20
  latitude_south: 50.90
  longitude_east: 1.80
  latitude_north: 51.20
  filter_local_by_bounding_box: false
  enable_map_entities: false
  include_class_b: true
  vessel_watchlist: ""
  clear_map_on_startup: false
  map_timeout_minutes: 30
  enable_api_monitoring: true
schema:
  data_source: "list(AISStream.io|Open Waters|AIS-catcher)"
  api_key: "password?"
  longitude_west: "float"
  latitude_south: "float"
  longitude_east: "float"
  latitude_north: "float"
  filter_local_by_bounding_box: "bool?"
  enable_map_entities: "bool?"
  include_class_b: "bool?"
  vessel_watchlist: "str?"
  clear_map_on_startup: "bool?"
  map_timeout_minutes: "int?"
  enable_api_monitoring: "bool?"